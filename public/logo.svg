<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px"
	 viewBox="0 0 40 40" style="enable-background:new 0 0 40 40;" xml:space="preserve">
  <defs>
    <linearGradient id="buildr-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="50%" style="stop-color:#0d9488"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="buildr-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="2" y="2" width="36" height="36" rx="9" fill="url(#buildr-grad)"/>
  <!-- "B" built from three stacked blocks (building-block metaphor) -->
  <!-- Top block -->
  <rect x="11" y="9" width="14" height="5" rx="1.5" fill="#ffffff" opacity="0.95"/>
  <!-- Middle block (indented right, forms the B's bump) -->
  <rect x="11" y="15.5" width="18" height="5" rx="1.5" fill="#ffffff" opacity="0.85"/>
  <!-- Bottom block -->
  <rect x="11" y="22" width="14" height="5" rx="1.5" fill="#ffffff" opacity="0.95"/>
  <!-- Left vertical stem -->
  <rect x="11" y="9" width="4.5" height="18" rx="1.5" fill="#ffffff"/>
  <!-- Sparkle dot (AI hint) -->
  <circle cx="29" cy="11" r="2" fill="url(#buildr-grad-light)"/>
  <circle cx="29" cy="11" r="1" fill="#ffffff" opacity="0.9"/>
</svg>
