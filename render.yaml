# Buildr production blueprint.
# Deploy the blueprint from Render after configuring the required secret env vars.
# The sandbox-runner requires a separate Docker host reachable over mutual TLS;
# Render does not provide a host Docker socket to services.
services:
  - type: web
    name: buildr-web
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    rootDir: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: HOSTNAME
        value: 0.0.0.0
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: SIDECAR_URL
        value: http://buildr-api-runtime:3030
      - key: SIDECAR_AUTH_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_FRAME_ANCESTORS
        value: "'self'"
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  - type: web
    name: buildr-api-runtime
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    rootDir: mini-services/api-runtime
    dockerfilePath: mini-services/api-runtime/Dockerfile
    dockerContext: mini-services/api-runtime
    healthCheckPath: /__health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3030
      - key: SIDECAR_AUTH_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SANDBOX_RUNNER_URL
        value: http://buildr-sandbox-runner:3031
      - key: SANDBOX_RUNNER_TOKEN
        sync: false

  - type: pserv
    name: buildr-sandbox-runner
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    rootDir: mini-services/api-runtime
    dockerfilePath: mini-services/api-runtime/Dockerfile
    dockerContext: mini-services/api-runtime
    dockerCommand: bun run sandbox-runner.ts
    healthCheckPath: /__health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3031
      - key: SANDBOX_RUNNER_PORT
        value: 3031
      - key: SANDBOX_RUNNER_TOKEN
        sync: false
      - key: SANDBOX_IMAGE
        sync: false
      - key: SANDBOX_REGISTRY_USERNAME
        sync: false
      - key: SANDBOX_REGISTRY_TOKEN
        sync: false
      - key: DOCKER_HOST
        sync: false
      - key: DOCKER_CA_PEM
        sync: false
      - key: DOCKER_CLIENT_CERT_PEM
        sync: false
      - key: DOCKER_CLIENT_KEY_PEM
        sync: false

  - type: web
    name: buildr-collab
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    rootDir: mini-services/collab-service
    dockerfilePath: mini-services/collab-service/Dockerfile
    dockerContext: mini-services/collab-service
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3004
      - key: NEXTAUTH_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
