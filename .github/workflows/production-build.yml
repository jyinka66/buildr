name: Production build and container validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: production
      NEXTAUTH_URL: https://build.invalid
      NEXTAUTH_SECRET: ci-only-not-a-real-secret-change-this-value
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-only-placeholder
      SUPABASE_ANON_KEY: ci-only-placeholder
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      SIDECAR_AUTH_TOKEN: ci-only-placeholder-token-value-32chars
      SANDBOX_RUNNER_URL: http://127.0.0.1:3031
      SANDBOX_RUNNER_TOKEN: ci-only-sandbox-token-value-32chars
      ALLOWED_ORIGINS: https://build.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run typecheck
      - run: npm run test:security
      - run: npm run test:sandbox
      - run: npm run test:deployment


  sandbox-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: production
      SANDBOX_RUNNER_TOKEN: ci-only-sandbox-token-value-32chars
      SANDBOX_RUNNER_PORT: 3031
      SANDBOX_IMAGE: buildr-sandbox:ci
      SANDBOX_DEBUG: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build disposable sandbox worker image
        run: docker build -t buildr-sandbox:ci -f mini-services/api-runtime/Dockerfile mini-services/api-runtime
      - name: Start isolated sandbox runner
        run: |
          bun run mini-services/api-runtime/sandbox-runner.ts > "$RUNNER_TEMP/buildr-sandbox-runner.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/buildr-sandbox-runner.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3031/__health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/buildr-sandbox-runner.log"
          exit 1
      - name: Run sandbox static and live Docker integration tests
        run: npm run test:sandbox
        env:
          SANDBOX_TEST_URL: http://127.0.0.1:3031
          SANDBOX_RUNNER_TOKEN: ci-only-sandbox-token-value-32chars
      - name: Print sandbox runner diagnostics on failure
        if: failure()
        run: cat "$RUNNER_TEMP/buildr-sandbox-runner.log"
      - name: Stop sandbox runner
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/buildr-sandbox-runner.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/buildr-sandbox-runner.pid")" 2>/dev/null || true
          fi

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NODE_ENV: production
      NEXTAUTH_URL: https://build.invalid
      NEXTAUTH_SECRET: ci-only-not-a-real-secret-change-this-value
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-only-placeholder
      SUPABASE_ANON_KEY: ci-only-placeholder
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      SIDECAR_AUTH_TOKEN: ci-only-placeholder-token-value-32chars
      SANDBOX_RUNNER_URL: http://127.0.0.1:3031
      SANDBOX_RUNNER_TOKEN: ci-only-sandbox-token-value-32chars
      ALLOWED_ORIGINS: https://build.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: buildr-web:ci
      - name: Build API runtime / sandbox orchestrator image
        uses: docker/build-push-action@v6
        with:
          context: mini-services/api-runtime
          file: mini-services/api-runtime/Dockerfile
          push: false
          tags: buildr-api-runtime:ci
      - name: Build collaboration image
        uses: docker/build-push-action@v6
        with:
          context: mini-services/collab-service
          file: mini-services/collab-service/Dockerfile
          push: false
          tags: buildr-collab:ci

  publish-sandbox-worker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docker-build, web-build, sandbox-integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve lowercase sandbox worker image name
        id: image
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-sandbox-worker:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: mini-services/api-runtime
          file: mini-services/api-runtime/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.image }}
